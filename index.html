<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4b5320">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="المهام">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>المهام المشتركة</title>
<style>
:root{--olive:#4b5320;--olive2:#6b7536;--sand:#f3efe3;--card:#fff;--ink:#23261a;--muted:#8d8d8d;--done:#e3e3e3;--ok:#3d7a3a;--line:#ddd6c3;--wa:#1fa855;--red:#a33;--gold:#8a6d1d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;background:var(--sand);color:var(--ink);padding-bottom:calc(74px + env(safe-area-inset-bottom));font-size:16px}
header{position:sticky;top:0;z-index:10;background:var(--olive);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
header h1{font-size:17px;margin:0;flex:1}
.net{width:10px;height:10px;border-radius:50%;background:#c33;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.net.on{background:#5fd35a}
.pill{font:inherit;font-size:12px;color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);padding:6px 12px;border-radius:14px;cursor:pointer}
main{padding:14px;max-width:640px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;font:inherit;font-size:13px;color:var(--muted);padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;cursor:pointer}
nav button b{font-size:21px;line-height:1}
nav button.on{color:var(--olive);font-weight:700}
nav .cnt{position:absolute;top:4px;left:calc(50% - 22px);background:var(--red);color:#fff;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
nav .cnt[hidden]{display:none}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);border:1px solid transparent}
.card.click{cursor:pointer}
.card.click:active{border-color:var(--olive2)}
.card.new{border-color:var(--wa);box-shadow:0 0 0 2px rgba(31,168,85,.15)}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.title{font-weight:700;font-size:16px}
.meta{font-size:12px;color:var(--muted);margin-top:4px}
.tag{font-size:10px;background:var(--wa);color:#fff;padding:2px 7px;border-radius:8px;margin-inline-start:6px;vertical-align:middle}
.bar{height:7px;background:#e8e3d4;border-radius:4px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.frac{font-size:13px;font-weight:700;color:var(--olive);white-space:nowrap}
.frac.full{color:var(--ok)}
.money{font-weight:700;color:var(--gold);white-space:nowrap}
.item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 12px;margin-bottom:8px;user-select:none;transition:background .2s,color .2s}
.item.tap{cursor:pointer}
.item.tap:active{transform:scale(.99)}
.item .chk{width:26px;height:26px;flex:none;border-radius:50%;border:2px solid var(--olive2);display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
.item .num{font-size:12px;color:var(--muted);flex:none;min-width:18px}
.item .txt{flex:1;line-height:1.5;word-break:break-word}
.item.done{background:var(--done);border-color:#d2d2d2;color:var(--muted)}
.item.done .txt{text-decoration:line-through}
.item.done .chk{background:#9b9b9b;border-color:#9b9b9b}
.item.pick{background:#eef8ef;border-color:var(--wa)}
.item.pick .chk{background:var(--wa);border-color:var(--wa)}
.mbar{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom));z-index:5;padding-top:2px}
.mbar .btn{box-shadow:0 3px 10px rgba(0,0,0,.18)}
.item.miss{background:#faf7f0;color:#9a8f7a;border-style:dashed}
.badge{flex:none;font-size:11px;background:var(--ok);color:#fff;padding:4px 8px;border-radius:10px;white-space:nowrap;text-align:center;line-height:1.3}
.badge small{display:block;font-size:10px;opacity:.9}
.badge.gray{background:#b9b1a0}
.totbox{display:flex;justify-content:space-between;align-items:center;background:#fbf6e6;border:1px solid #eadfb8;border-radius:10px;padding:12px 14px;margin-top:10px}
.totbox b{font-size:20px;color:var(--gold)}
.addrow{display:flex;gap:8px;margin:4px 0 8px}
.addrow input{flex:1}
.addrow button{flex:none;width:auto;margin:0;padding:0 18px}
.ibtn{font:inherit;background:none;border:0;color:var(--olive);font-size:18px;cursor:pointer;padding:2px 6px}
.btn{display:block;width:100%;font:inherit;font-weight:700;border:0;border-radius:10px;padding:13px;margin-top:10px;background:var(--olive);color:#fff;cursor:pointer}
.btn:active{opacity:.85}
.btn:disabled{opacity:.5}
.btn.wa{background:var(--wa)}
.btn.gold{background:var(--gold)}
.btn.ghost{background:#fff;color:var(--olive);border:1.5px solid var(--olive2)}
.btn.danger{background:#fff;color:var(--red);border:1.5px solid #dcb4b4}
.btn2{display:flex;gap:8px}.btn2 .btn{flex:1}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px;color:var(--olive)}
input,textarea{width:100%;font:inherit;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,textarea:focus{outline:none;border-color:var(--olive2)}
input.big{font-size:22px;font-weight:700;text-align:center;direction:ltr}
textarea{min-height:170px;resize:vertical;line-height:1.7}
.hint{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.6}
.empty{text-align:center;color:var(--muted);padding:40px 10px;line-height:1.8}
.empty b{display:block;font-size:44px;margin-bottom:8px}
.back{font:inherit;background:none;border:0;color:var(--olive);font-weight:700;padding:4px 0 12px;cursor:pointer}
.status{font-size:12px;padding:8px 10px;border-radius:8px;background:#f7f4ea;border:1px dashed var(--line);margin-top:10px;color:#555;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{font:inherit;font-size:13px;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:16px;padding:6px 12px;cursor:pointer}
.chip.on{background:var(--olive);border-color:var(--olive);color:#fff}
.sum{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.sum div{background:#fff;border-radius:12px;padding:12px 8px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.sum b{display:block;font-size:18px;color:var(--olive)}
.sum .g b{color:var(--gold)}
.sum span{font-size:11px;color:var(--muted)}
.dates{display:flex;gap:8px;margin-bottom:10px}
.dates input{flex:1;padding:8px}
.member{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #eee;font-size:14px}
.member:last-child{border-bottom:0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#bbb;margin-inline-end:6px}
.dot.on{background:#3cb043}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{background:#fff;width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .2s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 6px;font-size:17px;color:var(--olive)}
#toast{position:fixed;bottom:calc(86px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#23261a;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%;text-align:center}
#toast.show{opacity:1}
.pend{font-size:15px}
.pill.bt{opacity:.55;padding:6px 9px}
.pill.bt.on{opacity:1;background:#2a6fdb;border-color:#9cc0ff}
</style>
</head>
<body>
<header>
  <span class="net" id="net" title="الاتصال"></span>
  <h1>📋 المهام المشتركة</h1>
  <span id="pend" class="pend" hidden>⏳</span>
  <button class="pill bt" id="btBtn" hidden onclick="btConnectMenu()">🔵</button>
  <button class="pill" onclick="openSettings()" id="meBtn">⚙️</button>
</header>
<main id="main"></main>
<nav id="nav">
  <button data-tab="lists" onclick="go('lists')"><b>📋</b>القوائم<span class="cnt" id="cntIn" hidden></span></button>
  <button data-tab="master" onclick="go('master')"><b>📚</b>الرئيسية</button>
  <button data-tab="new" onclick="go('new')"><b>➕</b>قائمة جديدة</button>
  <button data-tab="arch" onclick="go('arch')"><b>🗄️</b>الأرشيف</button>
</nav>

<!-- الاسم -->
<div class="modal" id="mName"><div class="sheet">
  <h3>اسمك في البرنامج</h3>
  <div class="hint">يظهر هذا الاسم للطرف الآخر على القوائم وعند شراء الأصناف.</div>
  <input id="nameIn" maxlength="40" placeholder="مثال: مصباح">
  <button class="btn" onclick="saveName()">حفظ</button>
</div></div>

<!-- لوحة عامة (صنف / عنوان / أرشفة) -->
<div class="modal" id="mSheet" onclick="if(event.target===this)closeM('mSheet')"><div class="sheet" id="sheetBody"></div></div>

<!-- الإعدادات -->
<div class="modal" id="mSet" onclick="if(event.target===this)closeM('mSet')"><div class="sheet" id="setBody"></div></div>

<!-- إرسال رابط الربط -->
<div class="modal" id="mSend" onclick="if(event.target===this)closeM('mSend')"><div class="sheet">
  <h3>إرسال رابط الربط</h3>
  <div class="hint">يُرسل مرة واحدة فقط. بعد أن يفتحه الطرف الآخر تصله القوائم تلقائياً دون واتساب.</div>
  <button class="btn wa" onclick="sendWA()">🟢 إرسال عبر واتساب</button>
  <button class="btn ghost" id="shareBtn" onclick="sendShare()">↗️ مشاركة عبر تطبيق آخر</button>
  <button class="btn ghost" onclick="sendCopy()">📄 نسخ الرابط</button>
  <button class="btn danger" onclick="closeM('mSend')">إغلاق</button>
</div></div>

<div id="toast"></div>

<script>
'use strict';
const DB='https://todo-share-5ef5c-default-rtdb.europe-west1.firebasedatabase.app';
const KEY='todoShare.v2';
const CUR='د.ل';
const NATIVE=typeof window.AndroidBT!=='undefined';   // داخل تطبيق APK
let S={me:'',id:'',room:'',seen:{},cache:null,dirty:{}};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
if(!S.dirty)S.dirty={};
if(!S.master||typeof S.master!=='object')S.master={};   // القائمة الرئيسية: خاصة بهذا الجهاز ولا تُرسل
const UI={tab:'lists',open:null,range:'month',from:'',to:'',sel:{}};
let R={lists:{},members:{}};      // الحالة المحلية المدموجة (المرجع للعرض)
let RT={lists:{},members:{}};     // صورة ما على الخادم
let prev=null, es=null, online=false, firstSync=false, swReg=null, streamReady=false;
const BTS={state:'off',peer:'',synced:false};   // حالة البلوثوث

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rid(n){const a='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';const b=crypto.getRandomValues(new Uint8Array(n));let s='';for(const x of b)s+=a[x%62];return s;}
const fmtT=t=>new Date(t).toLocaleTimeString('ar-LY',{hour:'2-digit',minute:'2-digit'});
const fmtDay=t=>new Date(t).toLocaleDateString('ar-LY',{day:'numeric',month:'numeric',year:'numeric'});
const fmtD=t=>new Date(t).toLocaleDateString('ar-LY',{day:'numeric',month:'numeric'})+' '+fmtT(t);
function ago(t){const s=(Date.now()-t)/1000;if(s<90)return 'متصل الآن';if(s<3600)return 'منذ '+Math.round(s/60)+' دقيقة';if(s<86400)return 'منذ '+Math.round(s/3600)+' ساعة';return fmtD(t);}
const money=n=>(Math.round((+n||0)*1000)/1000).toLocaleString('en-US',{maximumFractionDigits:3})+' '+CUR;
function parseNum(s){
  s=String(s??'').trim().replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٫,]/g,'.').replace(/[^\d.]/g,'');
  if(s==='')return 0;const n=parseFloat(s);return isFinite(n)&&n>=0?Math.round(n*1000)/1000:NaN;
}
if(!S.id){S.id=rid(12);}
function save(){try{S.cache=R;localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
if(S.cache&&S.room)R=Object.assign({lists:{},members:{}},S.cache);
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2800);}
function openM(id){$(id).classList.add('show');}
function closeM(id){$(id).classList.remove('show');}
const WEB='https://musbahsaad.github.io/todo-share/';
const baseURL=()=>/^https:\/\/musbahsaad\.github\.io/.test(location.origin)?location.origin+location.pathname:WEB;
const pairLink=()=>baseURL()+'#room='+S.room;
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));

/* ===== أدوات البيانات ===== */
const ord=x=>x.o!=null?x.o:(+x.k||0);
function itemsObj(L){const it=(L&&L.items)||{};const o={};Object.keys(it).forEach(k=>{if(it[k]&&typeof it[k]==='object')o[k]=it[k];});return o;}
function itemsOf(L){const it=itemsObj(L);return Object.keys(it).filter(k=>!it[k].del).map(k=>Object.assign({},it[k],{k})).sort((a,b)=>ord(a)-ord(b));}
function stats(L){const it=itemsOf(L),n=it.length,b=it.filter(x=>x.d);const d=b.length;return{n,d,p:n?Math.round(d*100/n):0,total:b.reduce((s,x)=>s+(+x.p||0),0)};}
function listsArr(){return Object.keys(R.lists||{}).map(id=>Object.assign({},R.lists[id],{id})).filter(L=>L.title&&!L.del);}
const activeLists=()=>listsArr().filter(L=>!L.archived).sort((a,b)=>(b.created||0)-(a.created||0));
const archLists=()=>listsArr().filter(L=>L.archived).sort((a,b)=>(b.archived.at||0)-(a.archived.at||0));
const getL=id=>R.lists&&R.lists[id];
function fixItems(L){if(L&&(Array.isArray(L.items)||!L.items))L.items=itemsObj(L);return L;}

/* ===== الدمج: آخر تعديل يكسب (لكل صنف ولبيانات القائمة) ===== */
// عند التساوي يُفضَّل الطرف الثاني b (البيانات الواردة)
const newer=(a,b)=>(b.u||0)>=(a.u||0)?b:a;
function mergeList(a,b){
  if(!a)return clone(b);if(!b)return clone(a);
  const meta=newer(a,b),out={};
  Object.keys(meta).forEach(k=>{if(k!=='items')out[k]=clone(meta[k]);});
  const ai=itemsObj(a),bi=itemsObj(b);out.items={};
  new Set([...Object.keys(ai),...Object.keys(bi)]).forEach(k=>{
    const x=ai[k],y=bi[k];out.items[k]=clone(!x?y:!y?x:newer(x,y));
  });
  return out;
}
// تمثيل ثابت للمقارنة (مفاتيح مرتبة، المصفوفات ككائنات)
function canon(v){
  if(v===null||typeof v!=='object')return JSON.stringify(v);
  const o=Array.isArray(v)?Object.assign({},v):v;
  // الخادم يحذف القيم الفارغة والكائنات الفارغة، فنتجاهلها في المقارنة
  return '{'+Object.keys(o).filter(k=>o[k]!==null&&o[k]!==undefined).sort().map(k=>[k,canon(o[k])]).filter(x=>x[1]!=='{}').map(x=>JSON.stringify(x[0])+':'+x[1]).join(',')+'}';
}
function setAt(path,val){
  const p=path.split('/').filter(Boolean);
  if(!p.length){RT=Object.assign({lists:{},members:{}},val||{});return;}
  let o=RT;for(let i=0;i<p.length-1;i++){if(typeof o[p[i]]!=='object'||o[p[i]]===null)o[p[i]]={};o=o[p[i]];}
  if(val===null)delete o[p[p.length-1]];else o[p[p.length-1]]=val;
  if(!RT.lists)RT.lists={};if(!RT.members)RT.members={};
}
// دمج صورة الخادم في الحالة المحلية
function reconcile(){
  R.members=clone(RT.members||{});
  const ids=new Set([...Object.keys(RT.lists||{}),...Object.keys(R.lists||{})]);
  ids.forEach(id=>{
    const r=RT.lists[id],l=R.lists[id];
    if(r&&l){const m=mergeList(l,r);if(canon(m)!==canon(r))S.dirty[id]=1;else delete S.dirty[id];R.lists[id]=m;}
    else if(r){R.lists[id]=clone(r);}
    else if(l&&!S.dirty[id]){delete R.lists[id];}
  });
}

/* ===== الحفظ والإرسال ===== */
async function api(method,path,body){
  const r=await fetch(DB+'/rooms/'+S.room+path+'.json',{method,body:body===undefined?undefined:JSON.stringify(body)});
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.json();
}
// كل تعديل: يُطبَّق محلياً فوراً، ثم يُرسل للخادم وللبلوثوث (أو يُنتظر حتى يتوفر الاتصال)
function commit(ids){
  ids.forEach(id=>{S.dirty[id]=1;btSendList(id);});
  save();render();pushDirty();
}
const pushing={};
async function pushList(id){
  if(pushing[id]||!S.room)return;pushing[id]=1;
  try{
    const remote=await api('GET','/lists/'+id);
    const local=R.lists[id];if(!local){delete S.dirty[id];return;}
    const m=remote?mergeList(local,remote):clone(local);
    await api('PUT','/lists/'+id,m);
    R.lists[id]=m;RT.lists[id]=clone(m);delete S.dirty[id];save();
  }catch(e){}finally{delete pushing[id];}
}
async function pushDirty(){
  if(!S.room)return;
  const ids=Object.keys(S.dirty);if(!ids.length)return;
  await Promise.all(ids.map(pushList));
  updatePend();
}
function updatePend(){const n=Object.keys(S.dirty).length;const p=$('pend');if(p){p.hidden=!n;p.title=n+' تعديل بانتظار الإرسال للإنترنت';}}
setInterval(()=>{pushDirty();},20000);
window.addEventListener('online',()=>{pushDirty();if(!es||es.readyState===2)connect();});

function setNet(v){online=v;$('net').classList.toggle('on',v);$('net').title=v?'متصل بالإنترنت':'غير متصل بالإنترنت';}
function connect(){
  if(es){es.close();es=null;}
  if(!S.room)return;
  firstSync=false;prev=null;streamReady=false;
  es=new EventSource(DB+'/rooms/'+S.room+'.json');
  es.onopen=()=>{setNet(true);};
  es.onerror=()=>setNet(false);
  const handle=(type)=>e=>{
    let m;try{m=JSON.parse(e.data);}catch(_){return;}
    if(!m)return;
    if(type==='put')setAt(m.path,m.data);
    else if(m.data&&typeof m.data==='object')for(const k in m.data)setAt(m.path.replace(/\/$/,'')+'/'+k,m.data[k]);
    setNet(true);
    if(type==='put'&&(m.path==='/'||m.path===''))streamReady=true;
    if(!streamReady)return;
    reconcile();detectChanges();save();render();pushDirty();
  };
  es.addEventListener('put',handle('put'));
  es.addEventListener('patch',handle('patch'));
  es.addEventListener('cancel',()=>{setNet(false);toast('⚠️ رفض الخادم الوصول لهذا الربط');});
  heartbeat();
}
function heartbeat(){if(S.room&&S.me)api('PATCH','/members/'+S.id,{name:S.me,seen:Date.now()}).catch(()=>{});}
setInterval(heartbeat,60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){heartbeat();pushDirty();if(!es||es.readyState===2)connect();}});

/* ===== البلوثوث (داخل تطبيق APK فقط) ===== */
window.BT={
  _state(st,name){
    BTS.state=st;BTS.peer=name||BTS.peer;
    if(st==='connected'){BTS.synced=false;btSend({t:'hello',room:S.room,name:S.me,id:S.id});toast('🔵 متصل بلوثوث بـ '+(name||'الجهاز'));}
    if(st==='disconnected'||st==='off'){if(BTS.synced)toast('البلوثوث: انقطع الاتصال');BTS.synced=false;}
    if(st==='failed')toast('❌ تعذّر الاتصال بالبلوثوث — تأكد أن البرنامج مفتوح على الجهاز الآخر');
    paintBT();
  },
  _msg(line){let m;try{m=JSON.parse(line);}catch(e){return;}btReceive(m);},
  _devices(json){let d=[];try{d=JSON.parse(json);}catch(e){}showDevices(d);}
};
function btSend(o){if(NATIVE&&BTS.state==='connected')try{AndroidBT.send(JSON.stringify(o));}catch(e){}}
function btSendList(id){if(BTS.synced&&R.lists[id])btSend({t:'list',id,list:R.lists[id]});}
function btReceive(m){
  if(m.t==='hello'){
    if(m.room&&m.room!==S.room){
      if(!S.room||confirm('الجهاز الآخر ('+(m.name||'')+') مرتبط برابط مختلف. هل تريد الارتباط بنفس رابطه؟ (القوائم الحالية على هذا الجهاز لن تظهر)')){
        S.room=m.room;R={lists:{},members:{}};RT={lists:{},members:{}};S.dirty={};save();connect();
      }else{AndroidBT.disconnect();return;}
    }else if(!m.room&&!S.room){toast('أنشئ الربط من هذا الجهاز: اضغط «اتصال عبر البلوثوث»');return;}
    if(!m.room&&S.room)btSend({t:'hello',room:S.room,name:S.me,id:S.id});
    BTS.synced=true;BTS.peer=m.name||BTS.peer;
    btSend({t:'state',lists:R.lists});
    paintBT();render();return;
  }
  if(!BTS.synced)return;
  if(m.t==='state'){mergeIncoming(m.lists||{});toast('🔵 تمت المزامنة عبر البلوثوث');}
  else if(m.t==='list'&&m.id){const x={};x[m.id]=m.list;mergeIncoming(x);}
}
function mergeIncoming(lists){
  let changed=false;
  Object.keys(lists).forEach(id=>{
    const inc=lists[id];if(!inc)return;
    const m=mergeList(R.lists[id],inc);
    if(canon(m)!==canon(R.lists[id]||null)){R.lists[id]=m;changed=true;}
    if(canon(m)!==canon(RT.lists[id]||null))S.dirty[id]=1;
  });
  if(changed){detectChanges();save();render();}
  pushDirty();
}
function btConnectMenu(){

/* ===== التنبيهات ===== */
function detectChanges(){
  const cur={};listsArr().forEach(L=>cur[L.id]=L);
  if(prev&&firstSync){
    for(const id in cur){
      const L=cur[id],P=prev[id];
      if(!P){
        if(L.archived){if(L.archived.byId!==S.id)notify('📦 '+(L.archived.by||'الطرف الآخر')+' أكمل الشراء',L.title+' — المجموع '+money(stats(L).total));}
        else if(L.fromId!==S.id)notify('📥 قائمة جديدة من '+(L.from||''),L.title+' — '+stats(L).n+' صنف');
        continue;}
      const pi={};itemsOf(P).forEach(x=>pi[x.k]=x);
      itemsOf(L).forEach(x=>{
        const o=pi[x.k];
        if(!o&&x.byId&&x.byId!==S.id)notify('➕ '+(x.by||'الطرف الآخر')+' أضاف صنفاً',x.t+' — '+L.title);
        if(x.d&&!(o&&o.d)&&x.byId!==S.id)notify('🛒 '+(x.by||'الطرف الآخر')+' اشترى',x.t+(x.p?' — '+money(x.p):'')+' — '+L.title);
      });
    }
  }
  prev=JSON.parse(JSON.stringify(cur));firstSync=true;
}
function notify(title,body){
  toast(title+': '+body);
  if(navigator.vibrate)navigator.vibrate([60,40,60]);
  if(NATIVE){try{if(document.hidden)AndroidBT.notify(title,body);}catch(e){}return;}
  if(document.hidden&&'Notification' in window&&Notification.permission==='granted'){
    if(swReg)swReg.showNotification(title,{body,icon:'icon-192.png',badge:'icon-192.png',tag:'todo-'+Date.now(),dir:'rtl',lang:'ar'}).catch(()=>{});
    else try{new Notification(title,{body,icon:'icon-192.png'});}catch(e){}
  }
}
async function enableNotif(){
  if(!('Notification' in window)){toast('هذا المتصفح لا يدعم الإشعارات');return;}
  const p=await Notification.requestPermission();
  toast(p==='granted'?'🔔 تم تفعيل الإشعارات':'لم يتم السماح بالإشعارات');openSettings();
}

  const id=Date.now().toString(36)+rid(4),now=Date.now(),items={};
  lines.forEach((t,i)=>{items['n'+now.toString(36)+i.toString(36).padStart(2,'0')+rid(2)]={t,d:0,o:now+i,byId:S.id,by:S.me,u:now};});

    else patch={p};
  }

  const L=getL(lid);if(!L)return;const s=stats(L);
  $('sheetBody').innerHTML='<h3>📦 إكمال الشراء</h3>'+
    '<div class="totbox"><span>المجموع</span><b>'+money(s.total)+'</b></div>'+
    '<div class="status">تم شراء <b>'+s.d+'</b> من <b>'+s.n+'</b> صنف.'+(s.d<s.n?' الأصناف غير المشتراة تُحفظ في الأرشيف على أنها «لم تُشترَ».':'')+
    '<br>تُحفظ نسخة في الأرشيف عند الطرفين، ثم <b>تُصفَّر القائمة</b>: تبقى الأصناف نفسها وتُلغى المشتريات والأسعار لتُستعمل من جديد.</div>'+
    '<button class="btn gold" onclick="doArchive(\''+lid+'\')">✅ تم — نقل إلى الأرشيف</button>'+
    '<button class="btn ghost" onclick="closeM(\'mSheet\')">رجوع</button>';
  openM('mSheet');
}
function doArchive(lid){
  const L=fixItems(getL(lid));if(!L)return;const s=stats(L);
  const now=Date.now(),a={at:now,by:S.me,byId:S.id,total:s.total,bought:s.d,count:s.n};
  const aid=lid+'_a'+now.toString(36);
  const copy=clone(L);copy.archived=a;copy.srcId=lid;copy.u=now;delete copy.lastArch;
  Object.keys(copy.items).forEach(k=>{if(copy.items[k].del)delete copy.items[k];});
  R.lists[aid]=copy;
  // تصفير القائمة النشطة: نفس الأصناف بدون شراء ولا أسعار
  Object.keys(L.items).forEach(k=>{const it=L.items[k];if(!it.del){it.d=0;it.p=0;it.u=now;}});
  L.lastArch=now;L.u=now;
  closeM('mSheet');commit([aid,lid]);
  toast('📦 حُفظت في الأرشيف — المجموع '+money(s.total)+' — وصُفّرت القائمة');
}

/* ===== فلتر الأرشيف ===== */
function rangeBounds(){
  const n=new Date(),y=n.getFullYear(),m=n.getMonth();
  const day=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
  switch(UI.range){
    case 'month':return[new Date(y,m,1).getTime(),Infinity];
    case 'last':return[new Date(y,m-1,1).getTime(),new Date(y,m,1).getTime()-1];
    case 'd30':return[day(n).getTime()-29*864e5,Infinity];
    case 'year':return[new Date(y,0,1).getTime(),Infinity];
    case 'custom':{const f=UI.from?new Date(UI.from+'T00:00:00').getTime():0,t=UI.to?new Date(UI.to+'T23:59:59').getTime():Infinity;return[f,t];}
    default:return[0,Infinity];
  }
}
function setRange(r){UI.range=r;render();}
function setDates(){UI.from=$('dFrom').value;UI.to=$('dTo').value;UI.range='custom';render();}

/* ===== العرض ===== */
function progress(L){return '<div class="bar"><i style="width:'+stats(L).p+'%"></i></div>';}
function fracTag(L){const s=stats(L);return '<span class="frac'+(s.n&&s.d===s.n?' full':'')+'">'+s.d+' / '+s.n+'</span>';}
function itemHTML(L,x,i,arch){
  const cls=x.d?' done':(arch?' miss':'');
  return '<div class="item'+cls+(arch?'':' tap')+'"'+(arch?'':' onclick="openItem(\''+L.id+'\',\''+x.k+'\')"')+'>'+
    '<span class="chk">'+(x.d?'✓':'')+'</span><span class="num">'+(i+1)+'</span>'+
    '<span class="txt">'+esc(x.t)+'</span>'+
    (x.d?'<span class="badge">'+(x.p?money(x.p):'✓ تم')+'<small>'+esc(x.by||'')+' '+fmtT(x.d)+'</small></span>':(arch?'<span class="badge gray">لم يُشترَ</span>':''))+'</div>';
}
function listCards(arr,arch){
  return arr.map(L=>{const isNew=!arch&&L.fromId!==S.id&&!S.seen[L.id];const s=stats(L);
    return '<div class="card click'+(isNew?' new':'')+'" onclick="openList(\''+L.id+'\')"><div class="row between"><span class="title">'+esc(L.title)+(isNew?'<span class="tag">جديد</span>':'')+(S.dirty[L.id]?' <span title="بانتظار الإرسال">⏳</span>':'')+'</span>'+
      (arch?'<span class="money">'+money(s.total)+'</span>':fracTag(L))+'</div>'+
      '<div class="meta">'+(arch?'📦 '+fmtDay(L.archived.at)+' · '+esc(L.archived.by||'')+' · '+s.d+' من '+s.n+' صنف':(isSender(L)?'📤 أرسلتها'+(L.to?' إلى '+esc(L.to):''):'🛒 للشراء — من '+esc(L.from))+' · '+fmtD(L.created)+(s.total?' · <span class="money">'+money(s.total)+'</span>':''))+'</div>'+
      (arch?'':progress(L))+'</div>';}).join('');
}
function pairScreen(){
  $('nav').style.display='none';
  $('main').innerHTML='<div class="card"><div class="title">🔗 ربط الجهازين</div>'+
    '<div class="hint">يُربط جهازك بجهاز الطرف الآخر مرة واحدة فقط، وبعدها تصل القوائم وتتحدّث عند الطرفين.</div>'+
    (NATIVE?'<button class="btn" onclick="btConnectMenu()">🔵 ربط عبر البلوثوث (بدون إنترنت)</button>':'')+
    '<button class="btn wa" onclick="createRoom()">إنشاء رابط ربط وإرساله عبر واتساب</button></div>'+
    '<div class="card"><div class="title">لديك رابط ربط؟</div>'+
    '<div class="hint">افتح الرابط الذي وصلك مباشرة، أو الصقه هنا:</div>'+
    '<input id="joinIn" placeholder="الصق رابط الربط هنا" style="margin-top:10px" dir="ltr">'+
    '<button class="btn" onclick="joinRoom($(\'joinIn\').value)">ربط</button></div>';
}
// يحفظ ما يُكتب في الخانات والتركيز عند إعادة الرسم
function paint(html){
  const m=$('main'),a=document.activeElement,keep={};
  m.querySelectorAll('input[id],textarea[id]').forEach(e=>keep[e.id]=e.value);
  const fid=a&&m.contains(a)&&a.id?a.id:null,sel=fid&&a.selectionStart!=null?[a.selectionStart,a.selectionEnd]:null;
  m.innerHTML=html;
  for(const id in keep){const e=$(id);if(e&&e.type!=='date')e.value=keep[id];}
  if(fid){const e=$(fid);if(e){e.focus();if(sel)try{e.setSelectionRange(sel[0],sel[1]);}catch(_){}}}
}
function render(){
  $('meBtn').textContent='⚙️ '+(S.me||'الإعدادات');
  paintBT();updatePend();
  if(!S.room){pairScreen();return;}
  $('nav').style.display='flex';
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===UI.tab));
  const act=activeLists();
  const unseen=act.filter(L=>L.fromId!==S.id&&!S.seen[L.id]).length;
  const c=$('cntIn');c.hidden=!unseen;c.textContent=unseen;

  if(UI.open){
    const L=getL(UI.open);
    if(!L||L.del){UI.open=null;return render();}
    const Lx=Object.assign({},L,{id:UI.open}),s=stats(Lx),arch=!!L.archived,items=itemsOf(Lx),snd=isSender(L);
    const role=arch?'':snd?'<div class="status">📤 أنت مُرسِل هذه القائمة: تضيف الأصناف وتعدّلها، و'+esc(L.to||'الطرف الآخر')+' يشتريها. ترى كل شراء وثمنه فوراً.</div>'
                         :'<div class="status">🛒 أنت المشتري: اضغط على الصنف عند شرائه واكتب ثمنه، ثم «تم» عند انتهاء التسوق.</div>';
    let h='<button class="back" onclick="go(\''+(arch?'arch':'lists')+'\')">→ رجوع</button>'+
      '<div class="card"><div class="row between"><span class="title" style="font-size:18px">'+esc(L.title)+'</span>'+
      (!arch&&snd?'<button class="ibtn" title="تعديل" onclick="editTitle(\''+Lx.id+'\')">✏️</button>':'')+'</div>'+
      '<div class="meta">من: '+esc(L.from)+(L.to?' ← '+esc(L.to):'')+' · '+fmtD(L.created)+(L.lastArch&&!arch?' · آخر أرشفة '+fmtD(L.lastArch):'')+'</div>'+
      (arch?'<div class="status">📦 أُكملت في '+fmtD(L.archived.at)+' بواسطة '+esc(L.archived.by||'')+' — تم شراء '+s.d+' من '+s.n+'</div>':progress(Lx)+role)+
      (S.dirty[Lx.id]?'<div class="hint">⏳ هذه التعديلات محفوظة على الجهاز وتُرسل عند توفر الإنترنت'+(NATIVE?' أو البلوثوث':'')+'.</div>':'')+
      '<div class="totbox"><span>المجموع'+(arch?'':' حتى الآن')+'</span><b>'+money(s.total)+'</b></div>'+
      '</div>';
    h+=items.map((x,i)=>itemHTML(Lx,x,i,arch)).join('')||'<div class="empty" style="padding:20px">لا توجد أصناف</div>';
    if(!arch&&snd){
      h+='<div class="addrow"><input id="addIn" maxlength="120" placeholder="إضافة صنف جديد…" onkeydown="if(event.key===\'Enter\')addItem(\''+Lx.id+'\')"><button class="btn" onclick="addItem(\''+Lx.id+'\')">➕</button></div>'+
         '<button class="btn danger" onclick="delList(\''+Lx.id+'\')">🗑 حذف القائمة</button>';
    }else if(!arch){
      h+='<button class="btn gold" onclick="askArchive(\''+Lx.id+'\')">✅ تم — إكمال الشراء وأرشفتها</button>';
    }else{
      h+='<button class="btn danger" onclick="delList(\''+Lx.id+'\')">🗑 حذف من الأرشيف</button>';
    }
    paint(h);return;
  }

  if(UI.tab==='new'){
    if($('cTitle'))return; // النموذج مفتوح: لا تُعِد رسمه حتى لا تُمسح الخانات أثناء الكتابة
    $('main').innerHTML='<div class="card"><div class="title">قائمة مشتريات جديدة</div>'+
      '<label>إلى (اختياري)</label><input id="cTo" maxlength="40" placeholder="اسم الطرف الآخر">'+
      '<label>عنوان القائمة</label><input id="cTitle" maxlength="80" placeholder="مثال: مشتريات يوم السبت">'+
      '<button class="btn ghost" onclick="go(\'master\')">📚 اختيار من القائمة الرئيسية</button>'+
      '<label>الأصناف — صنف في كل سطر</label><textarea id="cItems" placeholder="خبز&#10;حليب&#10;طماطم"></textarea>'+
      '<div class="hint" id="cCount">0 صنف</div>'+
      '<button class="btn wa" id="cSend" onclick="createList()">📤 إرسال</button></div>';
    $('cItems').addEventListener('input',e=>{$('cCount').textContent=e.target.value.split('\n').filter(x=>x.trim()).length+' صنف';});
    return;
  }

  if(UI.tab==='master'){
    const a=masterArr(),n=selCount(),all=a.length&&n===a.length;
    let h='<div class="row between" style="margin-bottom:4px"><span class="title">📚 القائمة الرئيسية</span>'+
      (a.length?'<button class="chip'+(all?' on':'')+'" onclick="mAll()">'+(all?'إلغاء التحديد':'تحديد الكل')+'</button>':'')+'</div>'+
      '<div class="hint" style="margin:0 0 10px">قائمتك الثابتة على هذا الجهاز ولا تصل للطرف الآخر. حدّد منها الأصناف ثم «إرسال» لتكوين قائمة جديدة، وتبقى الرئيسية كما هي.</div>'+
      '<div class="addrow"><input id="mAddIn" maxlength="600" placeholder="إضافة صنف… (عدة أصناف: افصل بفاصلة)" onkeydown="if(event.key===\'Enter\')mAdd()"><button class="btn" onclick="mAdd()">➕</button></div>';
    h+=a.length?a.map((x,i)=>{const on=!!UI.sel[x.k];
        return '<div class="item tap'+(on?' pick':'')+'" onclick="mToggle(\''+x.k+'\')"><span class="chk">'+(on?'✓':'')+'</span><span class="num">'+(i+1)+'</span><span class="txt">'+esc(x.t)+'</span>'+
          '<button class="ibtn" title="تعديل" onclick="event.stopPropagation();mEdit(\''+x.k+'\')">✏️</button></div>';}).join('')
      :'<div class="empty"><b>📚</b>القائمة الرئيسية فارغة.<br>أضف الأصناف التي تشتريها عادةً، ثم اختر منها عند كل إرسال.</div>';
    if(n)h+='<div class="mbar"><button class="btn wa" onclick="mSendSel()">📤 إرسال المحدد ('+n+' صنف)</button></div>';
    paint(h);return;
  }

  if(UI.tab==='arch'){
    const [f,t]=rangeBounds();
    const arr=archLists().filter(L=>L.archived.at>=f&&L.archived.at<=t);
    let tot=0,items=0;arr.forEach(L=>{const s=stats(L);tot+=s.total;items+=s.d;});
    const chip=(k,l)=>'<button class="chip'+(UI.range===k?' on':'')+'" onclick="setRange(\''+k+'\')">'+l+'</button>';
    let h='<div class="title" style="margin-bottom:10px">🗄️ أرشيف المشتريات</div>'+
      '<div class="chips">'+chip('month','هذا الشهر')+chip('last','الشهر الماضي')+chip('d30','آخر 30 يوماً')+chip('year','هذه السنة')+chip('all','الكل')+chip('custom','فترة محددة')+'</div>'+
      (UI.range==='custom'?'<div class="dates"><input type="date" id="dFrom" value="'+esc(UI.from)+'" onchange="setDates()"><input type="date" id="dTo" value="'+esc(UI.to)+'" onchange="setDates()"></div>':'')+
      '<div class="sum"><div class="g"><b>'+money(tot)+'</b><span>إجمالي المشتريات</span></div><div><b>'+arr.length+'</b><span>قائمة</span></div><div><b>'+items+'</b><span>صنف مشترى</span></div></div>';
    h+=arr.length?listCards(arr,true):'<div class="empty"><b>🗄️</b>لا توجد قوائم مؤرشفة في هذه الفترة.<br>اضغط «✅ تم» داخل أي قائمة عند إكمال الشراء لنقلها هنا.</div>';
    paint(h);return;
  }

  let h='<div class="title" style="margin-bottom:12px">القوائم النشطة</div>';
  if(!act.length){
    const others=Object.keys(R.members||{}).filter(k=>k!==S.id).length;
    h+='<div class="empty"><b>📭</b>لا توجد قوائم نشطة.<br>'+(others||BTS.synced?'أنشئ قائمة جديدة أو انتظر قائمة من الطرف الآخر.<br><button class="btn" style="width:auto;padding:10px 16px" onclick="go(\'new\')">➕ قائمة جديدة</button>':'الطرف الآخر لم يرتبط بعد.<br><button class="btn wa" style="width:auto;padding:10px 16px" onclick="openM(\'mSend\')">📤 إرسال رابط الربط</button>'+(NATIVE?'<br><button class="btn" style="width:auto;padding:10px 16px" onclick="btConnectMenu()">🔵 أو اتصل عبر البلوثوث</button>':''))+'</div>';
  }else h+=listCards(act,false);
  paint(h);
}

/* ===== التشغيل ===== */
function fromHash(){
  const h=location.hash;
  if(/^#room=/.test(h)){
    const run=()=>{joinRoom(h);try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}};
    if(S.me)run();else window._pendingJoin=run;
  }
}
const _saveName=saveName;
saveName=function(){_saveName();if(S.me&&window._pendingJoin){const f=window._pendingJoin;window._pendingJoin=null;f();}};
window.addEventListener('hashchange',fromHash);
save();render();
if(!S.me)askName(true);
fromHash();
connect();
pushDirty();
if(NATIVE)try{AndroidBT.ready();}catch(e){}
</script>
</body>
