<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4b5320">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="المهام">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>المهام المشتركة</title>
<style>
:root{--olive:#4b5320;--olive2:#6b7536;--sand:#f3efe3;--card:#fff;--ink:#23261a;--muted:#8d8d8d;--done:#e3e3e3;--ok:#3d7a3a;--line:#ddd6c3;--wa:#1fa855;--red:#a33}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;background:var(--sand);color:var(--ink);padding-bottom:calc(74px + env(safe-area-inset-bottom));font-size:16px}
header{position:sticky;top:0;z-index:10;background:var(--olive);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
header h1{font-size:17px;margin:0;flex:1}
.net{width:10px;height:10px;border-radius:50%;background:#c33;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.net.on{background:#5fd35a}
.pill{font:inherit;font-size:12px;color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);padding:6px 12px;border-radius:14px;cursor:pointer}
main{padding:14px;max-width:640px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;font:inherit;font-size:13px;color:var(--muted);padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;cursor:pointer}
nav button b{font-size:21px;line-height:1}
nav button.on{color:var(--olive);font-weight:700}
nav .cnt{position:absolute;top:4px;left:calc(50% - 22px);background:var(--red);color:#fff;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);border:1px solid transparent}
.card.click{cursor:pointer}
.card.click:active{border-color:var(--olive2)}
.card.new{border-color:var(--wa);box-shadow:0 0 0 2px rgba(31,168,85,.15)}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.title{font-weight:700;font-size:16px}
.meta{font-size:12px;color:var(--muted);margin-top:4px}
.tag{font-size:10px;background:var(--wa);color:#fff;padding:2px 7px;border-radius:8px;margin-inline-start:6px;vertical-align:middle}
.bar{height:7px;background:#e8e3d4;border-radius:4px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.frac{font-size:13px;font-weight:700;color:var(--olive);white-space:nowrap}
.frac.full{color:var(--ok)}
.item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 12px;margin-bottom:8px;user-select:none;transition:background .2s,color .2s}
.item.tap{cursor:pointer}
.item.tap:active{transform:scale(.99)}
.item .chk{width:26px;height:26px;flex:none;border-radius:50%;border:2px solid var(--olive2);display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
.item .num{font-size:12px;color:var(--muted);flex:none;min-width:18px}
.item .txt{flex:1;line-height:1.5;word-break:break-word}
.item.done{background:var(--done);border-color:#d2d2d2;color:var(--muted)}
.item.done .txt{text-decoration:line-through}
.item.done .chk{background:#9b9b9b;border-color:#9b9b9b}
.badge{flex:none;font-size:11px;background:var(--ok);color:#fff;padding:4px 8px;border-radius:10px;white-space:nowrap;text-align:center;line-height:1.3}
.badge small{display:block;font-size:10px;opacity:.85}
.btn{display:block;width:100%;font:inherit;font-weight:700;border:0;border-radius:10px;padding:13px;margin-top:10px;background:var(--olive);color:#fff;cursor:pointer}
.btn:active{opacity:.85}
.btn:disabled{opacity:.5}
.btn.wa{background:var(--wa)}
.btn.ghost{background:#fff;color:var(--olive);border:1.5px solid var(--olive2)}
.btn.danger{background:#fff;color:var(--red);border:1.5px solid #dcb4b4}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px;color:var(--olive)}
input,textarea{width:100%;font:inherit;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,textarea:focus{outline:none;border-color:var(--olive2)}
textarea{min-height:170px;resize:vertical;line-height:1.7}
.hint{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.6}
.empty{text-align:center;color:var(--muted);padding:40px 10px;line-height:1.8}
.empty b{display:block;font-size:44px;margin-bottom:8px}
.back{font:inherit;background:none;border:0;color:var(--olive);font-weight:700;padding:4px 0 12px;cursor:pointer}
.status{font-size:12px;padding:8px 10px;border-radius:8px;background:#f7f4ea;border:1px dashed var(--line);margin-top:10px;color:#555;line-height:1.6}
.member{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #eee;font-size:14px}
.member:last-child{border-bottom:0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#bbb;margin-inline-end:6px}
.dot.on{background:#3cb043}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{background:#fff;width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .2s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 6px;font-size:17px;color:var(--olive)}
#toast{position:fixed;bottom:calc(86px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#23261a;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <span class="net" id="net" title="الاتصال"></span>
  <h1>📋 المهام المشتركة</h1>
  <button class="pill" onclick="openSettings()" id="meBtn">⚙️</button>
</header>
<main id="main"></main>
<nav id="nav">
  <button data-tab="inbox" onclick="go('inbox')"><b>📥</b>الواردة<span class="cnt" id="cntIn" hidden></span></button>
  <button data-tab="new" onclick="go('new')"><b>➕</b>قائمة جديدة</button>
  <button data-tab="sent" onclick="go('sent')"><b>📤</b>المرسلة</button>
</nav>

<!-- الاسم -->
<div class="modal" id="mName"><div class="sheet">
  <h3>اسمك في البرنامج</h3>
  <div class="hint">يظهر هذا الاسم للطرف الآخر على القوائم وعند إنجاز البنود.</div>
  <input id="nameIn" maxlength="40" placeholder="مثال: مصباح">
  <button class="btn" onclick="saveName()">حفظ</button>
</div></div>

<!-- الإعدادات -->
<div class="modal" id="mSet" onclick="if(event.target===this)closeM('mSet')"><div class="sheet" id="setBody"></div></div>

<!-- إرسال رابط الربط -->
<div class="modal" id="mSend" onclick="if(event.target===this)closeM('mSend')"><div class="sheet">
  <h3>إرسال رابط الربط</h3>
  <div class="hint">يُرسل مرة واحدة فقط. بعد أن يفتحه الطرف الآخر تصله القوائم تلقائياً دون واتساب.</div>
  <button class="btn wa" onclick="sendWA()">🟢 إرسال عبر واتساب</button>
  <button class="btn ghost" id="shareBtn" onclick="sendShare()">↗️ مشاركة عبر تطبيق آخر</button>
  <button class="btn ghost" onclick="sendCopy()">📄 نسخ الرابط</button>
  <button class="btn danger" onclick="closeM('mSend')">إغلاق</button>
</div></div>

<div id="toast"></div>

<script>
'use strict';
const DB='https://todo-share-5ef5c-default-rtdb.europe-west1.firebasedatabase.app';
const KEY='todoShare.v2';
let S={me:'',id:'',room:'',seen:{},cache:null};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
const UI={tab:'inbox',open:null};
let R={lists:{},members:{}};          // شجرة الغرفة الحية
let prev=null, es=null, online=false, firstSync=false, swReg=null;

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rid(n){const a='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';const b=crypto.getRandomValues(new Uint8Array(n));let s='';for(const x of b)s+=a[x%62];return s;}
const fmtT=t=>new Date(t).toLocaleTimeString('ar-LY',{hour:'2-digit',minute:'2-digit'});
const fmtD=t=>new Date(t).toLocaleDateString('ar-LY',{day:'numeric',month:'numeric'})+' '+fmtT(t);
function ago(t){const s=(Date.now()-t)/1000;if(s<90)return 'متصل الآن';if(s<3600)return 'منذ '+Math.round(s/60)+' دقيقة';if(s<86400)return 'منذ '+Math.round(s/3600)+' ساعة';return fmtD(t);}
if(!S.id){S.id=rid(12);}
function save(){try{S.cache=R;localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
if(S.cache&&S.room)R=Object.assign({lists:{},members:{}},S.cache);
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2800);}
function openM(id){$(id).classList.add('show');}
function closeM(id){$(id).classList.remove('show');}
const baseURL=()=>location.origin+location.pathname;
const pairLink=()=>baseURL()+'#room='+S.room;

/* ===== أدوات البيانات ===== */
function itemsOf(L){const it=(L&&L.items)||{};return Object.keys(it).filter(k=>it[k]).map(k=>Object.assign({k:+k},it[k])).sort((a,b)=>a.k-b.k);}
function stats(L){const it=itemsOf(L),n=it.length,d=it.filter(x=>x.d).length;return{n,d,p:n?Math.round(d*100/n):0};}
function listsArr(){return Object.keys(R.lists||{}).map(id=>Object.assign({id},R.lists[id])).filter(L=>L.title).sort((a,b)=>(b.created||0)-(a.created||0));}
const inbox=()=>listsArr().filter(L=>L.fromId!==S.id);
const sent=()=>listsArr().filter(L=>L.fromId===S.id);
function setAt(path,val){
  const p=path.split('/').filter(Boolean);
  if(!p.length){R=Object.assign({lists:{},members:{}},val||{});return;}
  let o=R;for(let i=0;i<p.length-1;i++){if(typeof o[p[i]]!=='object'||o[p[i]]===null)o[p[i]]={};o=o[p[i]];}
  if(val===null)delete o[p[p.length-1]];else o[p[p.length-1]]=val;
  if(!R.lists)R.lists={};if(!R.members)R.members={};
}

/* ===== الاتصال الحي ===== */
async function api(method,path,body){
  const r=await fetch(DB+'/rooms/'+S.room+path+'.json',{method,body:body===undefined?undefined:JSON.stringify(body)});
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.json();
}
function setNet(v){online=v;$('net').classList.toggle('on',v);$('net').title=v?'متصل':'غير متصل';}
function connect(){
  if(es){es.close();es=null;}
  if(!S.room)return;
  firstSync=false;prev=null;
  es=new EventSource(DB+'/rooms/'+S.room+'.json');
  es.onopen=()=>setNet(true);
  es.onerror=()=>setNet(false);
  const handle=(type)=>e=>{
    let m;try{m=JSON.parse(e.data);}catch(_){return;}
    if(!m)return;
    if(type==='put')setAt(m.path,m.data);
    else if(m.data&&typeof m.data==='object')for(const k in m.data)setAt(m.path.replace(/\/$/,'')+'/'+k,m.data[k]);
    setNet(true);
    detectChanges();
    save();render();
  };
  es.addEventListener('put',handle('put'));
  es.addEventListener('patch',handle('patch'));
  es.addEventListener('cancel',()=>{setNet(false);toast('⚠️ رفض الخادم الوصول لهذا الربط');});
  heartbeat();
}
function heartbeat(){if(S.room&&S.me)api('PATCH','/members/'+S.id,{name:S.me,seen:Date.now()}).catch(()=>{});}
setInterval(heartbeat,60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){heartbeat();if(!es||es.readyState===2)connect();}});

/* ===== التنبيهات ===== */
function detectChanges(){
  const cur={};listsArr().forEach(L=>cur[L.id]=L);
  if(prev&&firstSync){
    for(const id in cur){
      const L=cur[id],P=prev[id];
      if(!P&&L.fromId!==S.id)notify('📥 قائمة جديدة من '+(L.from||''),L.title+' — '+stats(L).n+' بند');
      if(P&&L.fromId===S.id){
        const pi={};itemsOf(P).forEach(x=>pi[x.k]=x);
        itemsOf(L).forEach(x=>{if(x.d&&!(pi[x.k]&&pi[x.k].d))notify('✅ '+(x.by||'الطرف الآخر')+' أنجز بنداً',x.t+' — '+L.title);});
        const s=stats(L),ps=stats(P);if(s.n&&s.d===s.n&&ps.d<ps.n)notify('🎉 اكتملت القائمة',L.title);
      }
    }
  }
  prev=JSON.parse(JSON.stringify(cur));firstSync=true;
}
function notify(title,body){
  toast(title+': '+body);
  if(navigator.vibrate)navigator.vibrate([60,40,60]);
  if(document.hidden&&'Notification' in window&&Notification.permission==='granted'){
    if(swReg)swReg.showNotification(title,{body,icon:'icon-192.png',badge:'icon-192.png',tag:'todo-'+Date.now(),dir:'rtl',lang:'ar'}).catch(()=>{});
    else try{new Notification(title,{body,icon:'icon-192.png'});}catch(e){}
  }
}
async function enableNotif(){
  if(!('Notification' in window)){toast('هذا المتصفح لا يدعم الإشعارات');return;}
  const p=await Notification.requestPermission();
  toast(p==='granted'?'🔔 تم تفعيل الإشعارات':'لم يتم السماح بالإشعارات');openSettings();
}
if('serviceWorker' in navigator&&/^https:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').then(r=>swReg=r).catch(()=>{});

/* ===== الربط بين الجهازين ===== */
function createRoom(){S.room=rid(24);R={lists:{},members:{}};save();connect();render();openM('mSend');}
function joinRoom(code){
  const m=String(code).match(/room=([A-Za-z0-9]{20,})/)||String(code).trim().match(/^([A-Za-z0-9]{20,})$/);
  if(!m){toast('❌ رابط الربط غير صحيح');return false;}
  if(S.room===m[1]){toast('أنت مرتبط بهذا الرابط بالفعل');return true;}
  if(S.room&&!confirm('أنت مرتبط حالياً بطرف آخر. الانتقال إلى الرابط الجديد؟'))return false;
  S.room=m[1];R={lists:{},members:{}};save();connect();UI.tab='inbox';UI.open=null;render();toast('🔗 تم الربط بنجاح');return true;
}
function leaveRoom(){if(!confirm('فك الربط على هذا الجهاز؟ (القوائم تبقى محفوظة في الربط ويمكن العودة بنفس الرابط)'))return;
  if(es)es.close();es=null;api('DELETE','/members/'+S.id).catch(()=>{});S.room='';R={lists:{},members:{}};save();setNet(false);closeM('mSet');render();}
const pairMsg=()=>'🔗 رابط ربط «المهام المشتركة» من '+S.me+'\nافتحه على جوالك ليرتبط البرنامج بجهازي وتصلك القوائم تلقائياً:\n'+pairLink();
function sendWA(){window.open('https://wa.me/?text='+encodeURIComponent(pairMsg()),'_blank');closeM('mSend');}
async function sendShare(){try{await navigator.share({text:pairMsg()});closeM('mSend');}catch(e){}}
async function sendCopy(){
  try{await navigator.clipboard.writeText(pairMsg());toast('📄 تم النسخ');}
  catch(e){const ta=document.createElement('textarea');ta.value=pairMsg();document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('📄 تم النسخ');}catch(_){toast('تعذّر النسخ');}ta.remove();}
  closeM('mSend');
}

/* ===== الاسم والإعدادات ===== */
function askName(force){$('nameIn').value=S.me||'';const m=$('mName');m.onclick=force?null:(e=>{if(e.target===m)closeM('mName');});openM('mName');setTimeout(()=>$('nameIn').focus(),200);}
function saveName(){const v=$('nameIn').value.trim();if(!v){toast('اكتب اسمك');return;}S.me=v;save();closeM('mName');heartbeat();render();}
function openSettings(){
  const mem=R.members||{};
  const ml=Object.keys(mem).map(k=>{const x=mem[k]||{};const on=Date.now()-(x.seen||0)<90000;
    return '<div class="member"><span><span class="dot'+(on?' on':'')+'"></span>'+esc(x.name||'—')+(k===S.id?' (أنت)':'')+'</span><span class="meta" style="margin:0">'+(k===S.id?'هذا الجهاز':ago(x.seen||0))+'</span></div>';}).join('');
  const np=('Notification' in window)?Notification.permission:'unsupported';
  $('setBody').innerHTML='<h3>الإعدادات</h3>'+
    '<label>الاسم</label><div class="row"><input value="'+esc(S.me)+'" disabled><button class="btn ghost" style="width:auto;margin:0;padding:11px 14px" onclick="closeM(\'mSet\');askName()">تعديل</button></div>'+
    (S.room?'<label>الأجهزة المرتبطة</label><div class="card" style="margin:0;padding:6px 12px">'+(ml||'<div class="meta">لا يوجد</div>')+'</div>'+
      '<button class="btn wa" onclick="closeM(\'mSet\');openM(\'mSend\')">📤 إرسال رابط الربط للطرف الآخر</button>':'')+
    (np==='granted'?'<div class="status">🔔 الإشعارات مفعّلة</div>':np==='unsupported'?'':'<button class="btn ghost" onclick="enableNotif()">🔔 تفعيل الإشعارات</button>')+
    (S.room?'<button class="btn danger" onclick="leaveRoom()">فك الربط على هذا الجهاز</button>':'')+
    '<button class="btn ghost" onclick="closeM(\'mSet\')">إغلاق</button>';
  openM('mSet');
}

/* ===== العمليات ===== */
function go(tab){UI.tab=tab;UI.open=null;render();scrollTo(0,0);}
function openList(id){UI.open=id;S.seen[id]=1;save();render();scrollTo(0,0);}
function toggle(lid,k){
  const L=R.lists[lid];if(!L||L.fromId===S.id)return;
  const it=L.items&&L.items[k];if(!it)return;
  const old={d:it.d||0,by:it.by||''};
  it.d=it.d?0:Date.now();it.by=S.me;
  if(navigator.vibrate)navigator.vibrate(it.d?35:15);
  save();render();
  api('PATCH','/lists/'+lid+'/items/'+k,{d:it.d,by:S.me}).catch(()=>{it.d=old.d;it.by=old.by;save();render();toast('⚠️ تعذّر الحفظ — تحقق من الإنترنت');});
  const s=stats(L);if(it.d&&s.d===s.n)toast('👏 أُنجزت كل البنود — وصل الإشعار للمرسِل');
}
async function createList(){
  const to=$('cTo').value.trim(),title=$('cTitle').value.trim();
  const lines=$('cItems').value.split('\n').map(x=>x.replace(/^\s*(\d+[\-\.\)]|[-•*])\s*/,'').trim()).filter(Boolean);
  if(!title){toast('اكتب عنوان القائمة');return;}
  if(!lines.length){toast('أضف بنداً واحداً على الأقل');return;}
  const id=Date.now().toString(36)+rid(4);
  const L={title,from:S.me,fromId:S.id,to,created:Date.now(),items:lines.map(t=>({t,d:0}))};
  const b=$('cSend');b.disabled=true;b.textContent='جارٍ الإرسال…';
  try{await api('PUT','/lists/'+id,L);R.lists[id]=L;save();UI.tab='sent';UI.open=id;render();toast('✅ وصلت القائمة للطرف الآخر');}
  catch(e){b.disabled=false;b.textContent='📤 إرسال';toast('⚠️ تعذّر الإرسال — تحقق من الإنترنت');}
}
async function delList(id){
  const L=R.lists[id];if(!L)return;
  if(!confirm('حذف القائمة «'+L.title+'»؟ ستُحذف عند الطرفين.'))return;
  try{await api('DELETE','/lists/'+id);delete R.lists[id];save();UI.open=null;render();toast('🗑 تم الحذف');}
  catch(e){toast('⚠️ تعذّر الحذف — تحقق من الإنترنت');}
}

/* ===== العرض ===== */
function progress(L){return '<div class="bar"><i style="width:'+stats(L).p+'%"></i></div>';}
function fracTag(L){const s=stats(L);return '<span class="frac'+(s.n&&s.d===s.n?' full':'')+'">'+s.d+' / '+s.n+'</span>';}
function itemHTML(L,x,i,tap){
  return '<div class="item'+(x.d?' done':'')+(tap?' tap':'')+'"'+(tap?' onclick="toggle(\''+L.id+'\','+x.k+')"':'')+'>'+
    '<span class="chk">'+(x.d?'✓':'')+'</span><span class="num">'+(i+1)+'</span>'+
    '<span class="txt">'+esc(x.t)+'</span>'+
    (x.d?'<span class="badge">✓ أُنجز<small>'+fmtT(x.d)+'</small></span>':'')+'</div>';
}
function listCards(arr,box){
  return arr.map(L=>{const isNew=box==='inbox'&&!S.seen[L.id];
    return '<div class="card click'+(isNew?' new':'')+'" onclick="openList(\''+L.id+'\')"><div class="row between"><span class="title">'+esc(L.title)+(isNew?'<span class="tag">جديد</span>':'')+'</span>'+fracTag(L)+'</div>'+
    '<div class="meta">'+(box==='inbox'?'من: '+esc(L.from):'إلى: '+esc(L.to||'—'))+' · '+fmtD(L.created)+'</div>'+progress(L)+'</div>';}).join('');
}
function pairScreen(){
  $('nav').style.display='none';
  $('main').innerHTML='<div class="card"><div class="title">🔗 ربط الجهازين</div>'+
    '<div class="hint">يُربط جهازك بجهاز الطرف الآخر مرة واحدة فقط، وبعدها تصل القوائم وتتحدّث حالة البنود فوراً عند الطرفين دون أي رسائل.</div>'+
    '<button class="btn wa" onclick="createRoom()">إنشاء رابط ربط وإرساله للطرف الآخر</button></div>'+
    '<div class="card"><div class="title">لديك رابط ربط؟</div>'+
    '<div class="hint">افتح الرابط الذي وصلك مباشرة، أو الصقه هنا:</div>'+
    '<input id="joinIn" placeholder="الصق رابط الربط هنا" style="margin-top:10px" dir="ltr">'+
    '<button class="btn" onclick="joinRoom($(\'joinIn\').value)">ربط</button></div>';
}
function render(){
  $('meBtn').textContent='⚙️ '+(S.me||'الإعدادات');
  if(!S.room){pairScreen();return;}
  $('nav').style.display='flex';
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===UI.tab));
  const ib=inbox();
  const pend=ib.filter(L=>{const s=stats(L);return s.d<s.n;}).length;
  const c=$('cntIn');c.hidden=!pend;c.textContent=pend;
  const m=$('main');

  if(UI.open){
    const L=listsArr().find(x=>x.id===UI.open);
    if(!L){UI.open=null;return render();}
    const s=stats(L),inb=L.fromId!==S.id,box=inb?'inbox':'sent';
    const items=itemsOf(L),last=items.filter(x=>x.d).sort((a,b)=>b.d-a.d)[0];
    let h='<button class="back" onclick="go(\''+box+'\')">→ رجوع</button>'+
      '<div class="card"><div class="row between"><span class="title" style="font-size:18px">'+esc(L.title)+'</span>'+fracTag(L)+'</div>'+
      '<div class="meta">'+(inb?'من: '+esc(L.from):'إلى: '+esc(L.to||'—'))+' · '+fmtD(L.created)+'</div>'+progress(L)+
      (inb?'<div class="hint" style="margin-top:8px">اضغط على البند عند إنجازه، فيظهر فوراً عند '+esc(L.from)+'. اضغط مرة أخرى للتراجع.</div>':
        '<div class="status">'+(last?'🕒 آخر إنجاز: «'+esc(last.t)+'» — '+esc(last.by||'')+' '+fmtD(last.d):'⏳ لم يُنجز أي بند بعد. ستتحدّث الحالة هنا فوراً عند الإنجاز.')+'</div>')+
      '</div>';
    h+=items.map((x,i)=>itemHTML(L,x,i,inb)).join('');
    h+='<button class="btn danger" onclick="delList(\''+L.id+'\')">🗑 حذف القائمة</button>';
    m.innerHTML=h;return;
  }

  if(UI.tab==='new'){
    m.innerHTML='<div class="card"><div class="title">قائمة مهام جديدة</div>'+
      '<label>إلى (اختياري)</label><input id="cTo" maxlength="40" placeholder="اسم الطرف الآخر">'+
      '<label>عنوان القائمة</label><input id="cTitle" maxlength="80" placeholder="مثال: مهام يوم السبت">'+
      '<label>البنود — بند في كل سطر</label><textarea id="cItems" placeholder="شراء قطع الغيار&#10;مراجعة التقرير&#10;الاتصال بالمكتب"></textarea>'+
      '<div class="hint" id="cCount">0 بند</div>'+
      '<button class="btn wa" id="cSend" onclick="createList()">📤 إرسال</button></div>';
    $('cItems').addEventListener('input',e=>{$('cCount').textContent=e.target.value.split('\n').filter(x=>x.trim()).length+' بند';});
    return;
  }

  const box=UI.tab,arr=box==='inbox'?ib:sent();
  let h='<div class="title" style="margin-bottom:12px">'+(box==='inbox'?'القوائم الواردة':'القوائم المرسلة')+'</div>';
  if(!arr.length){
    const others=Object.keys(R.members||{}).filter(k=>k!==S.id).length;
    h+=box==='inbox'?'<div class="empty"><b>📭</b>لا توجد قوائم واردة.<br>'+(others?'ستظهر هنا فور إرسالها من الطرف الآخر.':'الطرف الآخر لم يرتبط بعد.<br><button class="btn wa" style="width:auto;padding:10px 16px" onclick="openM(\'mSend\')">📤 إرسال رابط الربط</button>')+'</div>'
                   :'<div class="empty"><b>📤</b>لم ترسل أي قائمة بعد.<br><button class="btn" style="width:auto;padding:10px 16px" onclick="go(\'new\')">➕ قائمة جديدة</button></div>';
  }else h+=listCards(arr,box);
  m.innerHTML=h;
}

/* ===== التشغيل ===== */
function fromHash(){
  const h=location.hash;
  if(/^#room=/.test(h)){
    const run=()=>{joinRoom(h);try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}};
    if(S.me)run();else window._pendingJoin=run;
  }
}
const _saveName=saveName;
saveName=function(){_saveName();if(S.me&&window._pendingJoin){const f=window._pendingJoin;window._pendingJoin=null;f();}};
window.addEventListener('hashchange',fromHash);
save();render();
if(!S.me)askName(true);
fromHash();
connect();
</script>
</body>
</html>
